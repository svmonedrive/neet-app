<div
  class="layout"
  [class.drawer-open]="drawerOpen()"
  [style.--panel-width.px]="panelWidth()"
  (document:keydown.escape)="drawerOpen.set(false)"
>
  <!-- Phones only: the chapter list lives in a drawer opened from here. -->
  <div class="topbar">
    <button
      type="button"
      class="menu-button"
      aria-label="Open chapter list"
      [attr.aria-expanded]="drawerOpen()"
      (click)="drawerOpen.set(true)"
    >&#9776;</button>
    <app-breadcrumb class="topbar-crumbs" [items]="crumbs()" />
  </div>
  <aside class="panel" (click)="closeDrawerOnLink($event)">
    <header class="panel-header">
      <a class="back" routerLink="/">&larr; All subjects</a>
      <h2><a [routerLink]="['/', subject()]">{{ title() }}</a></h2>
    </header>
    <nav>
      @for (c of chapters.value() ?? []; track c.slug) {
        <app-nav-node
          [subject]="subject()"
          [path]="c.slug"
          [title]="c.title"
          [column]="c.column"
          [current]="currentPath()"
        />
      }
    </nav>
  </aside>
  @if (drawerOpen()) {
    <div class="backdrop" (click)="drawerOpen.set(false)"></div>
  }
  <div
    class="divider"
    role="separator"
    aria-orientation="vertical"
    aria-label="Resize chapter list"
    [attr.aria-valuenow]="panelWidth()"
    tabindex="0"
    (pointerdown)="startResize($event)"
    (pointermove)="resize($event)"
    (pointerup)="endResize($event)"
    (pointercancel)="endResize($event)"
    (keydown)="resizeWithKeys($event)"
  ></div>
  <main class="main">
    @if (body.error() || sub.error()) {
      <p class="error">Could not load this page.</p>
    } @else {
      <app-breadcrumb class="crumbbar" [items]="crumbs()" />
      <app-doc-viewer [content]="markdown() ?? ''" />
    }
  </main>
</div>
